# Build the .deb package and publish a GitHub release.
# Triggered by tags in the form v<version>-<revision>, e.g. v0.1.0-1.

name: release

on:
  push:
    tags:
      - 'v*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=${TAG%-*}" >> "$GITHUB_ENV"
          echo "REVISION=${TAG##*-}" >> "$GITHUB_ENV"

      - name: Check changelog version
        run: |
          CHANGELOG_VERSION=$(head -1 changelog | sed -n 's/^runvpn (\(.*\)).*/\1/p')
          if [ "$CHANGELOG_VERSION" != "$VERSION-$REVISION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match changelog version $CHANGELOG_VERSION" >&2
            exit 1
          fi

      - name: Build package
        run: ./make-package "$VERSION" "$REVISION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "runvpn_${VERSION}-${REVISION}_all.deb" \
            --title "runvpn $VERSION-$REVISION" \
            --notes "$(sed -n '3,/^ --/{/^ --/d;p}' changelog)"
